# Included into Red Pitaya's nginx server block.

# Whether our bitstream is loaded: {"running": true|false}.
location = /ttl2nim/status {
    default_type application/json;
    add_header Cache-Control no-store;

    content_by_lua '
        local function first_line(path)
            local file = io.open(path, "r")
            if not file then return nil end
            local line = file:read("*l")
            file:close()
            return line
        end

        local function design_name()
            local file = io.open("/opt/redpitaya/www/apps/ttl2nim/design.info", "r")
            if not file then return nil end
            local name
            for line in file:lines() do
                name = line:match("^%s*name%s*=%s*([%l%d_]+)") or name
            end
            file:close()
            return name
        end

        local name = design_name()
        ngx.say(cjson.encode({running = name ~= nil and first_line("/tmp/loaded_fpga.inf") == name}))
    ';
}
