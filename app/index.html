<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TTL2NIM</title>
    <link rel="icon" href="info/icon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/theme.js"></script>
    <!-- Shared by the stock apps -->
    <script src="../assets/pako.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header>
      <!-- Red Pitaya's main menu; opening it stops the app -->
      <a class="home" href="/" aria-label="Home">
        <svg aria-hidden="true">
          <use href="assets/home.svg#icon" />
        </svg>
      </a>
      <h1>TTL2NIM</h1>
      <span id="status" class="status" data-state="connecting"
        >Connecting…</span
      >
      <button id="theme" class="theme" type="button" aria-label="Toggle theme">
        <svg aria-hidden="true">
          <use href="assets/theme.svg#icon" />
        </svg>
      </button>
    </header>
    <main>
      <section class="total">
        <h2>Total delay</h2>
        <div id="total" class="value">
          <label
            ><input
              type="text"
              inputmode="decimal"
              autocomplete="off"
              enterkeyhint="next"
              value="–"
              disabled
              aria-label="Total delay, µs"
            />
            µs</label
          >
          <label
            ><input
              type="text"
              inputmode="decimal"
              autocomplete="off"
              enterkeyhint="done"
              value="–"
              disabled
              aria-label="Total delay, ns"
            />
            ns</label
          >
        </div>
      </section>
      <section class="delay">
        <h2><span id="coarse-scale">Coarse</span><span class="steps"></span></h2>
        <output id="coarse-value" class="value" for="coarse"><span class="time">–</span></output>
        <div class="control">
          <input
            id="coarse"
            type="range"
            autocomplete="off"
            min="0"
            max="0"
            value="0"
            disabled
            aria-labelledby="coarse-scale"
          />
          <div class="nudge">
            <button class="step" type="button" data-step="-16" disabled aria-label="Coarse −16 steps">
              <svg aria-hidden="true"><use href="assets/steps.svg#many" /></svg>
            </button>
            <button class="step" type="button" data-step="-1" disabled aria-label="Coarse −1 step">
              <svg aria-hidden="true"><use href="assets/steps.svg#one" /></svg>
            </button>
            <button class="step" type="button" data-value="0" disabled aria-label="Coarse to 0">
              <svg aria-hidden="true"><use href="assets/steps.svg#zero" /></svg>
            </button>
            <button class="step" type="button" data-step="1" disabled aria-label="Coarse +1 step">
              <svg aria-hidden="true"><use href="assets/steps.svg#one" /></svg>
            </button>
            <button class="step" type="button" data-step="16" disabled aria-label="Coarse +16 steps">
              <svg aria-hidden="true"><use href="assets/steps.svg#many" /></svg>
            </button>
          </div>
        </div>
      </section>
      <section class="delay">
        <h2><span id="fine-scale">Fine</span><span class="steps"></span></h2>
        <output id="fine-value" class="value" for="fine"><span class="time">–</span></output>
        <div class="control">
          <input
            id="fine"
            type="range"
            autocomplete="off"
            min="0"
            max="0"
            value="0"
            disabled
            aria-labelledby="fine-scale"
          />
          <div class="nudge">
            <button class="step" type="button" data-step="-16" disabled aria-label="Fine −16 steps">
              <svg aria-hidden="true"><use href="assets/steps.svg#many" /></svg>
            </button>
            <button class="step" type="button" data-step="-1" disabled aria-label="Fine −1 step">
              <svg aria-hidden="true"><use href="assets/steps.svg#one" /></svg>
            </button>
            <button class="step" type="button" data-value="0" disabled aria-label="Fine to 0">
              <svg aria-hidden="true"><use href="assets/steps.svg#zero" /></svg>
            </button>
            <button class="step" type="button" data-step="1" disabled aria-label="Fine +1 step">
              <svg aria-hidden="true"><use href="assets/steps.svg#one" /></svg>
            </button>
            <button class="step" type="button" data-step="16" disabled aria-label="Fine +16 steps">
              <svg aria-hidden="true"><use href="assets/steps.svg#many" /></svg>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
